<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTech Stock Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e1e5ea}
        .header{background:#1a1d28;padding:10px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2a2d38}
        .header h1{font-size:16px;color:#4fc3f7}
        .search-box{flex:1;max-width:400px;display:flex;gap:4px}
        .search-box input{width:100%;padding:7px 10px;border-radius:6px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:13px}
        .search-box input:focus{outline:none;border-color:#4fc3f7}
        .btn{padding:6px 12px;border-radius:5px;border:none;cursor:pointer;font-size:12px;font-weight:500}
        .btn-p{background:#4fc3f7;color:#0f1117}
        .btn-s{background:#2a2d38;color:#e1e5ea;border:1px solid #3a3d48}
        .btn:hover{opacity:0.85}
        .settings{display:none;background:#1a1d28;padding:10px 20px;border-bottom:1px solid #2a2d38;font-size:12px}
        .settings label{margin-right:10px;cursor:pointer}
        .settings input[type=number]{width:50px;padding:3px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;text-align:center}
        .settings select{padding:3px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea}
        .settings-row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
        .settings-row strong{color:#8b9dc3;min-width:60px}
        .ma-item{display:inline-flex;align-items:center;gap:3px;margin-right:8px}
        .container{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:1600px;margin:0 auto}
        .panel{background:#1a1d28;border-radius:8px;border:1px solid #2a2d38;overflow:hidden}
        .panel-header{padding:10px 14px;border-bottom:1px solid #2a2d38;display:flex;align-items:center;justify-content:space-between}
        .panel-header h2{font-size:13px;color:#8b9dc3}
        .panel-body{max-height:450px;overflow-y:auto}
        .full-width{grid-column:1/-1}
        .chart-container{width:100%;display:flex;flex-direction:column}
        .chart-main{width:100%;height:280px}
        .chart-sub{width:100%;height:120px}
        .fund-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
        .fund-chart{height:200px;background:#14161e;border-radius:6px;padding:8px}
        .fund-chart h3{font-size:11px;color:#8b9dc3;margin-bottom:4px}
        .stock-item{padding:8px 14px;border-bottom:1px solid #1f222d;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background 0.15s}
        .stock-item:hover{background:#22253a}
        .stock-item .info{display:flex;align-items:center;gap:8px}
        .stock-item .rank{color:#ffb74d;font-weight:700;width:24px}
        .stock-item .code{color:#4fc3f7;font-size:12px}
        .stock-item .name{font-size:13px}
        .stock-item .del{color:#ef5350;cursor:pointer;font-size:14px;padding:2px 6px}
        .stock-info{display:flex;align-items:center;gap:12px;padding:10px 14px}
        .stock-info .code{font-size:18px;font-weight:700;color:#4fc3f7}
        .stock-info .name{font-size:13px;color:#8b9dc3}
        .loading{text-align:center;padding:30px;color:#6b7a8d;font-size:12px}
        @media(max-width:900px){.container{grid-template-columns:1fr}.fund-charts{grid-template-columns:1fr}}
        .float-notes{position:fixed;top:80px;right:30px;width:360px;height:420px;background:#1a1d28;border:1px solid #3a3d48;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:9999;display:none;flex-direction:column;overflow:hidden}
        .float-notes-header{padding:8px 12px;background:#14161e;border-bottom:1px solid #2a2d38;cursor:move;display:flex;align-items:center;justify-content:space-between;user-select:none}
        .float-notes-header span{font-size:12px;color:#8b9dc3;font-weight:600}
        .float-notes-body{flex:1;overflow-y:auto;padding:8px}
        .float-alert{position:fixed;top:100px;left:50%;transform:translateX(-50%);width:420px;max-height:520px;background:#1a1d28;border:1px solid #3a3d48;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:9999;display:none;flex-direction:column;overflow:hidden}
        .float-alert-header{padding:8px 12px;background:#14161e;border-bottom:1px solid #2a2d38;cursor:move;display:flex;align-items:center;justify-content:space-between;user-select:none}
        .float-alert-header span{font-size:12px;color:#ffeb3b;font-weight:600}
        .float-alert-body{flex:1;overflow-y:auto;padding:10px;font-size:11px}
        .alert-form select,.alert-form input{padding:3px 6px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:11px}
        .alert-form label{color:#8b9dc3;font-size:10px}
        .alert-list-item{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #2a2d38}
        .float-backtest{position:fixed;top:60px;left:50px;width:520px;max-height:600px;background:#1a1d28;border:1px solid #3a3d48;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.6);z-index:9998;display:none;flex-direction:column;overflow:hidden}
        .float-backtest-header{padding:8px 12px;background:#14161e;border-bottom:1px solid #2a2d38;cursor:move;display:flex;align-items:center;justify-content:space-between;user-select:none}
        .float-backtest-header span{font-size:12px;color:#66bb6a;font-weight:600}
        .float-backtest-body{flex:1;overflow-y:auto;padding:10px;font-size:11px}
        .bt-cond{display:flex;gap:4px;align-items:center;margin-bottom:4px;padding:3px;background:#0f1117;border-radius:4px}
    </style>
</head>
<body>
<div class="header">
    <h1>📈 ProTech Stock</h1>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="輸入股票代號 (如 2330, DJI, IXIC, SOX)" />
        <button class="btn btn-p" onclick="doSearch()">查詢</button>
    </div>
    <div style="display:flex;gap:3px;">
        <button class="btn btn-s" onclick="loadStock('TWII')" style="font-size:10px;padding:3px 6px;">🇹🇼 加權</button>
        <button class="btn btn-s" onclick="loadStock('DJI')" style="font-size:10px;padding:3px 6px;">🇺🇸 道瓊</button>
        <button class="btn btn-s" onclick="loadStock('IXIC')" style="font-size:10px;padding:3px 6px;">那斯達</button>
        <button class="btn btn-s" onclick="loadStock('SOX')" style="font-size:10px;padding:3px 6px;">費半</button>
    </div>
    <div style="display:flex;align-items:center;gap:4px;">
        <span style="font-size:11px;color:#8b9dc3;">👤</span>
        <input type="text" id="userInput" placeholder="使用者名稱" style="width:90px;padding:5px 8px;border-radius:6px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:12px;" onchange="switchUser(this.value)">
    </div>
    <button class="btn btn-s" onclick="toggleSettings()">⚙ 設定</button>
</div>

<!-- Settings Panel -->
<div class="settings" id="settingsPanel">
    <div class="settings-row">
        <strong>子圖：</strong>
        <label><input type="radio" name="sub" value="vol" checked onchange="reloadChart()"> VOL</label>
        <label><input type="radio" name="sub" value="macd" onchange="reloadChart()"> MACD</label>
    </div>
    <div class="settings-row">
        <strong>MA：</strong>
        <div id="maSettings"></div>
        <button class="btn btn-s" onclick="addMA()" style="font-size:11px;">+ 新增</button>
    </div>
    <div class="settings-row">
        <strong>日資訊：</strong>
        <label><input type="checkbox" id="chkDayInfo" checked onchange="renderDayInfo()"> 顯示當日最高/最低/漲跌幅</label>
    </div>
</div>

<div class="container">
    <!-- Stock Chart Panel -->
    <div class="panel full-width" id="stockPanel" style="display:none;">
        <div class="panel-header">
            <div class="stock-info">
                <button class="btn btn-s" onclick="navWatchStock(-1)" title="上一檔" style="padding:2px 6px;font-size:14px;">▲</button>
                <button class="btn btn-s" onclick="navWatchStock(1)" title="下一檔" style="padding:2px 6px;font-size:14px;">▼</button>
                <span class="code" id="stockCode"></span>
                <span class="name" id="stockName"></span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <select id="selPeriod" onchange="reloadChart()" style="padding:4px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:12px;">
                    <option value="daily">日線</option>
                    <option value="weekly">週線</option>
                    <option value="monthly">月線</option>
                </select>
                <input type="number" id="numDays" value="120" min="20" max="500" onchange="reloadChart()" style="width:50px;padding:4px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:12px;text-align:center;">
                <button class="btn btn-s" id="btnWatch" onclick="toggleWatch()">★ 加入自選</button>
                <button class="btn btn-s" id="btnDraw" onclick="toggleDraw()">✏ 畫線</button>
                <button class="btn btn-s" id="btnText" onclick="toggleText()">T 文字</button>
                <button class="btn btn-s" id="btnClearLines" onclick="clearDrawLines()" style="display:none;">🗑 清除</button>
                <button class="btn btn-s" onclick="screenshotToNote()">📷 截圖</button>
                <button class="btn btn-s" onclick="toggleFloatNotes()">📝 備註</button>
                <button class="btn btn-s" onclick="openBacktest()">📊 回測</button>
                <button class="btn btn-s" onclick="closeStock()">✕</button>
            </div>
        </div>
        <div id="dayInfoBar" style="padding:4px 14px;font-size:12px;color:#e1e5ea;display:flex;gap:16px;background:#14161e;border-bottom:1px solid #2a2d38;"></div>
        <div class="chart-container" id="chartContainer"></div>
        <!-- Fundamental charts -->
        <div class="fund-charts" id="fundCharts">
            <div class="fund-chart"><h3>年度營收走勢</h3><div id="revenueChart" style="height:170px"></div></div>
            <div class="fund-chart"><h3>歷年股利</h3><div id="dividendChart" style="height:170px"></div></div>
        </div>
    </div>

    <!-- Watchlist -->
    <div class="panel">
        <div class="panel-header"><h2>★ 自選股</h2></div>
        <div class="panel-body" id="watchlistPanel"><div class="loading">無自選股</div></div>
    </div>

    <!-- Hot / Rank Panel -->
    <div class="panel">
        <div class="panel-header">
            <h2 id="listPanelTitle">🔥 社群爆紅榜</h2>
            <div id="listPanelBtns">
                <button class="btn btn-p" onclick="loadHot('active')" style="font-size:10px;padding:3px 6px;">瀏覽</button>
                <button class="btn btn-s" onclick="loadHot('trending')" style="font-size:10px;padding:3px 6px;">激增</button>
                <button class="btn btn-s" onclick="loadHot('search')" style="font-size:10px;padding:3px 6px;">搜尋</button>
            </div>
        </div>
        <div style="display:flex;gap:0;border-bottom:1px solid #2a2d38;">
            <button class="btn btn-s" onclick="loadHot()" id="tabHot" style="flex:1;border-radius:0;border:none;border-bottom:2px solid #4fc3f7;">爆紅榜</button>
            <button class="btn btn-s" onclick="loadRank('up','all')" id="tabUp" style="flex:1;border-radius:0;border:none;">漲幅</button>
            <button class="btn btn-s" onclick="loadRank('down','all')" id="tabDown" style="flex:1;border-radius:0;border:none;">跌幅</button>
        </div>
        <div class="panel-body" id="listPanel"><div class="loading">載入中...</div></div>
    </div>

    <!-- News Panel -->
    <div class="panel full-width" id="newsPanel">
        <div class="panel-header">
            <h2>📰 新聞</h2>
            <div>
                <a id="newsLink" href="https://tw.stock.yahoo.com/tw-market/" target="_blank" class="btn btn-p" style="text-decoration:none;">開啟台股新聞 →</a>
            </div>
        </div>
    </div>

    <!-- News Notes -->
    <div class="panel full-width">
        <div class="panel-header">
            <h2>📋 新聞備註</h2>
        </div>
        <div style="padding:10px 14px;">
            <div style="display:flex;gap:4px;margin-bottom:8px;align-items:center;">
                <input type="date" id="newsNoteDate" style="padding:5px 8px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:12px;">
                <textarea id="newsNoteInput" placeholder="輸入新聞備註..." rows="2" style="flex:1;padding:6px 10px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:12px;resize:vertical;line-height:1.5;"></textarea>
                <label class="btn btn-s" style="cursor:pointer;">📎<input type="file" accept="image/*" multiple style="display:none;" onchange="uploadNewsNote(this.files)"></label>
                <button class="btn btn-p" onclick="submitNewsNote()">送出</button>
            </div>
            <div style="display:flex;gap:4px;margin-bottom:8px;align-items:center;">
                <input type="text" id="newsNoteSearch" placeholder="🔍 搜尋備註內容..." style="flex:1;padding:6px 10px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:12px;" oninput="searchNewsNotes()">
                <button class="btn btn-s" onclick="aiSearchNotes()" style="font-size:10px;padding:4px 8px;">🤖 AI搜尋</button>
                <button class="btn btn-s" onclick="document.getElementById('newsNoteSearch').value='';loadNewsNotes();" style="font-size:10px;padding:4px 8px;">清除</button>
            </div>
            <div id="newsNotesList"></div>
        </div>
    </div>
</div>

<!-- Floating Notes Window -->
<div class="float-notes" id="floatNotes">
    <div class="float-notes-header" id="floatNotesHeader">
        <span id="floatNotesTitle">📝 備註</span>
        <span onclick="closeFloatNotes()" style="cursor:pointer;color:#ef5350;font-size:14px;">✕</span>
    </div>
    <div class="float-notes-body" id="floatNotesBody"></div>
</div>

<!-- Floating Alert Panel -->
<div class="float-alert" id="floatAlert">
    <div class="float-alert-header" id="floatAlertHeader">
        <span id="floatAlertTitle">🔔 警示設定</span>
        <span onclick="closeAlertPanel()" style="cursor:pointer;color:#ef5350;font-size:14px;">✕</span>
    </div>
    <div class="float-alert-body" id="floatAlertBody"></div>
</div>

<!-- Floating Backtest Panel -->
<div class="float-backtest" id="floatBacktest">
    <div class="float-backtest-header" id="floatBacktestHeader">
        <span>📊 回測</span>
        <span onclick="closeBacktest()" style="cursor:pointer;color:#ef5350;font-size:14px;">✕</span>
    </div>
    <div class="float-backtest-body" id="floatBacktestBody"></div>
</div>

<script>
// --- State ---
let chart = null, currentCode = '', lastData = [];
let candleSeries = null;
let watchGroups = {};
let currentUser = (localStorage.getItem('protech_user') || 'default').toLowerCase();
const MA_COLORS = ['#ffeb3b','#2196f3','#e91e63','#66bb6a','#ff9800'];
let maLines = [{period:5,on:true},{period:20,on:true},{period:60,on:true}];

function U(url){return url+(url.includes('?')?'&':'?')+'user='+encodeURIComponent(currentUser);}
function switchUser(name){
    name=(name.trim()||'default').toLowerCase();
    currentUser=name;
    localStorage.setItem('protech_user',name);
    document.getElementById('userInput').value=name==='default'?'':name;
    loadWatchlist();
    loadNewsNotes();
}

// --- Settings ---
function toggleSettings(){ const p=document.getElementById('settingsPanel'); p.style.display=p.style.display==='none'?'block':'none'; }

function renderMASettings(){
    const c=document.getElementById('maSettings');
    c.innerHTML=maLines.map((m,i)=>`<span class="ma-item">
        <input type="checkbox" ${m.on?'checked':''} onchange="maLines[${i}].on=this.checked;reloadChart()">
        <input type="number" value="${m.period}" min="2" max="250" style="width:40px" onchange="maLines[${i}].period=+this.value;reloadChart()">
        <span style="color:${MA_COLORS[i]}">■</span>
        <span onclick="maLines.splice(${i},1);renderMASettings();reloadChart()" style="cursor:pointer;color:#ef5350;">✕</span>
    </span>`).join('');
}
function addMA(){ if(maLines.length<5){maLines.push({period:10,on:true});renderMASettings();reloadChart();} }

// --- Search ---
function doSearch(){
    const v=document.getElementById('searchInput').value.trim().toUpperCase();
    if(/^\d{4}$/.test(v)) loadStock(v);
    else if(['DJI','IXIC','SOX','TWII','^DJI','^IXIC','^SOX','^TWII'].includes(v)) loadStock(v.replace('^',''));
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

// --- Stock Detail ---
const US_INDICES=['DJI','IXIC','SOX','TWII'];
const US_NAMES={DJI:'道瓊工業指數',IXIC:'那斯達克綜合指數',SOX:'費城半導體指數',TWII:'上市加權指數'};
function isUSIndex(code){return US_INDICES.includes(code);}

async function loadStock(code){
    currentCode=code;
    document.getElementById('stockPanel').style.display='block';
    document.getElementById('stockCode').textContent=code;
    document.getElementById('stockPanel').scrollIntoView({behavior:'smooth'});

    if(isUSIndex(code)){
        document.getElementById('stockName').textContent=US_NAMES[code]||'';
        document.getElementById('fundCharts').style.display='none';
        document.getElementById('newsLink').href=`https://finance.yahoo.com/quote/%5E${code}`;
        document.getElementById('newsLink').textContent=`開啟 ${code} Yahoo →`;
    } else {
        if(!window._sm){const r=await fetch('/api/stocks');window._sm={};(await r.json()).forEach(s=>window._sm[s.code]=s.name);}
        document.getElementById('stockName').textContent=window._sm[code]||'';
        document.getElementById('fundCharts').style.display='';
        loadFundamentals(code);
        document.getElementById('newsLink').href=`https://tw.news.search.yahoo.com/search?p=${code}&fr=finance`;
        document.getElementById('newsLink').textContent=`開啟 ${code} 新聞 →`;
    }
    updateWatchBtn();
    await reloadChart();
    if(floatNotesOpen) renderFloatNotes(code);
}

async function reloadChart(){
    if(!currentCode)return;
    const period=document.getElementById('selPeriod').value;
    const days=document.getElementById('numDays').value;
    let url;
    if(isUSIndex(currentCode)){
        url=`/api/usindex/${currentCode}/kline?period=${period}&days=${days}`;
    } else {
        url=`/api/stock/${currentCode}/kline?period=${period}&days=${days}`;
    }
    const r=await fetch(url);
    lastData=await r.json();
    renderChart(lastData);
    renderDayInfo();
}

function renderDayInfo(){
    const bar=document.getElementById('dayInfoBar');
    const show=document.getElementById('chkDayInfo')?.checked;
    if(!show||!lastData||!lastData.length){bar.innerHTML='';return;}
    const d=lastData[lastData.length-1];
    const prev=lastData.length>1?lastData[lastData.length-2]:null;
    const change=prev?(d.close-prev.close):0;
    const changePct=prev&&prev.close>0?((change/prev.close)*100):0;
    const color=change>=0?'#ef5350':'#26a69a';
    bar.innerHTML=`
        <span>收盤: <b style="color:${color}">${d.close}</b></span>
        <span>最高: <b style="color:#ef5350">${d.high}</b></span>
        <span>最低: <b style="color:#26a69a">${d.low}</b></span>
        <span>漲跌: <b style="color:${color}">${change>=0?'+':''}${change.toFixed(2)} (${changePct>=0?'+':''}${changePct.toFixed(2)}%)</b></span>
        <span>成交量: <b>${d.volume?d.volume.toLocaleString():'-'}</b></span>
    `;
}
function updateDayInfoFromCrosshair(param){
    const show=document.getElementById('chkDayInfo')?.checked;
    if(!show)return;
    if(!param.time||!lastData||!lastData.length){renderDayInfo();return;}
    const timeStr=param.time;
    const idx=lastData.findIndex(d=>d.date===timeStr);
    if(idx<0){renderDayInfo();return;}
    const d=lastData[idx];
    const prev=idx>0?lastData[idx-1]:null;
    const change=prev?(d.close-prev.close):0;
    const changePct=prev&&prev.close>0?((change/prev.close)*100):0;
    const color=change>=0?'#ef5350':'#26a69a';
    const bar=document.getElementById('dayInfoBar');
    bar.innerHTML=`
        <span style="color:#8b9dc3;">${d.date}</span>
        <span>開: <b>${d.open}</b></span>
        <span>收: <b style="color:${color}">${d.close}</b></span>
        <span>高: <b style="color:#ef5350">${d.high}</b></span>
        <span>低: <b style="color:#26a69a">${d.low}</b></span>
        <span>漲跌: <b style="color:${color}">${change>=0?'+':''}${change.toFixed(2)} (${changePct>=0?'+':''}${changePct.toFixed(2)}%)</b></span>
        <span>量: <b>${d.volume?d.volume.toLocaleString():'-'}</b></span>
    `;
}

function closeStock(){ document.getElementById('stockPanel').style.display='none'; currentCode=''; drawLines=[];drawTexts=[]; document.getElementById('btnClearLines').style.display='none'; document.getElementById('newsLink').href='https://tw.stock.yahoo.com/tw-market/'; document.getElementById('newsLink').textContent='開啟台股新聞 →'; }
function navWatchStock(dir){
    if(!currentCode)return;
    let grp=null,idx=-1;
    for(const[g,codes] of Object.entries(watchGroups)){
        const i=codes.indexOf(currentCode);
        if(i>=0){grp=g;idx=i;break;}
    }
    if(grp===null)return;
    const codes=watchGroups[grp];
    const newIdx=idx+dir;
    if(newIdx<0||newIdx>=codes.length)return;
    loadStock(codes[newIdx]);
}
function openYahooNews(){ window.open(`https://tw.news.search.yahoo.com/search?p=${currentCode}&fr=finance`,'_blank'); }

// --- Chart ---
function computeMA(data,period){
    return data.map((d,i)=>{
        if(i<period-1)return null;
        const avg=data.slice(i-period+1,i+1).reduce((s,x)=>s+x.close,0)/period;
        return{time:d.time,value:Math.round(avg*100)/100};
    }).filter(Boolean);
}
function computeMACD(data){
    const c=data.map(d=>d.close);
    const ema=(arr,p)=>{const k=2/(p+1);let r=[arr[0]];for(let i=1;i<arr.length;i++)r.push(arr[i]*k+r[i-1]*(1-k));return r;};
    const e12=ema(c,12),e26=ema(c,26),dif=e12.map((v,i)=>v-e26[i]),dea=ema(dif,9);
    return{dif:data.map((d,i)=>({time:d.time,value:+(dif[i]).toFixed(2)})),
           dea:data.map((d,i)=>({time:d.time,value:+(dea[i]).toFixed(2)})),
           hist:data.map((d,i)=>({time:d.time,value:+((dif[i]-dea[i])*2).toFixed(2)}))};
}

function renderChart(data){
    const container=document.getElementById('chartContainer');
    container.innerHTML='<div class="chart-main" id="chartMain"></div><div class="chart-sub" id="chartSub"></div>';
    if(!data||data.length===0){container.innerHTML='<div class="loading">無K線資料</div>';return;}

    const sub=document.querySelector('input[name=sub]:checked').value;
    const mainEl=document.getElementById('chartMain'), subEl=document.getElementById('chartSub');
    const chartOpts=(el,h)=>({width:el.clientWidth,height:h,layout:{background:{color:'#1a1d28'},textColor:'#8b9dc3'},grid:{vertLines:{color:'#2a2d38'},horzLines:{color:'#2a2d38'}},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},timeScale:{borderColor:'#2a2d38'}});

    chart=LightweightCharts.createChart(mainEl,chartOpts(mainEl,280));
    const subChart=LightweightCharts.createChart(subEl,{...chartOpts(subEl,120),timeScale:{borderColor:'#2a2d38',visible:true}});

    const cd=data.map(d=>({time:d.date,open:d.open,high:d.high,low:d.low,close:d.close}));
    const cs=chart.addCandlestickSeries({upColor:'#ef5350',downColor:'#26a69a',borderUpColor:'#ef5350',borderDownColor:'#26a69a',wickUpColor:'#ef5350',wickDownColor:'#26a69a'});
    cs.setData(cd);
    candleSeries=cs;

    // MA
    const maMarkers=[];
    maLines.forEach((m,i)=>{
        if(!m.on)return;
        const s=chart.addLineSeries({color:MA_COLORS[i],lineWidth:1,lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
        s.setData(computeMA(cd,m.period));
        // 扣抵標記：最新K棒往前第 period 根即為明日扣抵
        const idx=cd.length-m.period;
        if(idx>=0){
            maMarkers.push({time:cd[idx].time,position:'belowBar',color:MA_COLORS[i],shape:'arrowUp',text:`▽MA${m.period}: ${cd[idx].close}`});
        }
    });
    if(maMarkers.length){
        maMarkers.sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);
        cs.setMarkers(maMarkers);
    }

    // Sub chart content
    if(sub==='vol'){
        const vs=subChart.addHistogramSeries({priceFormat:{type:'volume'},color:'#4fc3f760'});
        vs.setData(data.map(d=>({time:d.date,value:d.volume,color:d.close>=d.open?'#ef535080':'#26a69a80'})));
    } else {
        const macd=computeMACD(cd);
        const hs=subChart.addHistogramSeries({});
        hs.setData(macd.hist.map(d=>({time:d.time,value:d.value,color:d.value>=0?'#ef535080':'#26a69a80'})));
        const ds=subChart.addLineSeries({color:'#ffeb3b',lineWidth:1,lastValueVisible:false,priceLineVisible:false});
        ds.setData(macd.dif);
        const de=subChart.addLineSeries({color:'#2196f3',lineWidth:1,lastValueVisible:false,priceLineVisible:false});
        de.setData(macd.dea);
    }

    // Sync time scales
    chart.timeScale().fitContent();
    subChart.timeScale().fitContent();
    let syncing=false;
    chart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(syncing)return;syncing=true;subChart.timeScale().setVisibleLogicalRange(r);syncing=false;});
    subChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(syncing)return;syncing=true;chart.timeScale().setVisibleLogicalRange(r);syncing=false;});

    // Sync crosshair
    chart.subscribeCrosshairMove(p=>{
        if(p.time)subChart.setCrosshairPosition(NaN,p.time,subChart.timeScale());
        updateDayInfoFromCrosshair(p);
    });
    subChart.subscribeCrosshairMove(p=>{if(p.time)chart.setCrosshairPosition(NaN,p.time,chart.timeScale());});

    new ResizeObserver(()=>{chart.applyOptions({width:mainEl.clientWidth});subChart.applyOptions({width:subEl.clientWidth});redrawCanvas();}).observe(container);
    chart.timeScale().subscribeVisibleLogicalRangeChange(()=>redrawCanvas());
}

// --- Drawing ---
let drawMode='', drawLines=[], drawTexts=[], drawCanvas=null;
function toggleDraw(){
    drawMode=drawMode==='line'?'':'line';
    document.getElementById('btnDraw').style.background=drawMode==='line'?'#4fc3f7':'#2a2d38';
    document.getElementById('btnDraw').style.color=drawMode==='line'?'#0f1117':'#e1e5ea';
    document.getElementById('btnText').style.background=drawMode==='text'?'#4fc3f7':'#2a2d38';
    document.getElementById('btnText').style.color=drawMode==='text'?'#0f1117':'#e1e5ea';
    document.getElementById('btnClearLines').style.display=(drawLines.length||drawTexts.length)?'inline-block':'none';
    const el=document.getElementById('chartMain');
    if(el)el.style.cursor=drawMode?'crosshair':'';
}
function toggleText(){
    drawMode=drawMode==='text'?'':'text';
    document.getElementById('btnText').style.background=drawMode==='text'?'#4fc3f7':'#2a2d38';
    document.getElementById('btnText').style.color=drawMode==='text'?'#0f1117':'#e1e5ea';
    document.getElementById('btnDraw').style.background=drawMode==='line'?'#4fc3f7':'#2a2d38';
    document.getElementById('btnDraw').style.color=drawMode==='line'?'#0f1117':'#e1e5ea';
    const el=document.getElementById('chartMain');
    if(el)el.style.cursor=drawMode?'crosshair':'';
}
function clearDrawLines(){drawLines=[];drawTexts=[];redrawCanvas();document.getElementById('btnClearLines').style.display='none';}
function pixToLogical(x,y){
    if(!chart||!candleSeries)return null;
    const li=chart.timeScale().coordinateToLogical(x);
    const price=candleSeries.coordinateToPrice(y);
    if(li==null||price==null)return null;
    return{li,price};
}
function logicalToPix(li,price){
    if(!chart||!candleSeries)return null;
    const x=chart.timeScale().logicalToCoordinate(li);
    const y=candleSeries.priceToCoordinate(price);
    if(x==null||y==null)return null;
    return{x,y};
}
function ensureCanvas(){
    const mainEl=document.getElementById('chartMain');
    if(!mainEl)return null;
    let c=mainEl.querySelector('.draw-canvas');
    if(!c){
        c=document.createElement('canvas');c.className='draw-canvas';
        c.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;';
        mainEl.style.position='relative';mainEl.appendChild(c);
    }
    c.width=mainEl.clientWidth;c.height=mainEl.clientHeight;
    drawCanvas=c;return c;
}
function redrawCanvas(){
    const c=ensureCanvas();if(!c)return;
    const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
    ctx.strokeStyle='#ff9800';ctx.lineWidth=2;
    drawLines.forEach(l=>{
        const p1=logicalToPix(l.li1,l.price1),p2=logicalToPix(l.li2,l.price2);
        if(!p1||!p2)return;
        ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    });
    ctx.font='12px sans-serif';ctx.fillStyle='#ffeb3b';
    drawTexts.forEach(t=>{
        const p=logicalToPix(t.li,t.price);
        if(!p)return;
        ctx.fillText(t.text,p.x,p.y);
    });
}
function initDrawing(){
    const el=document.getElementById('chartContainer');
    let startPt=null;
    el.addEventListener('pointerdown',e=>{
        if(!drawMode)return;
        const mainEl=document.getElementById('chartMain');
        if(!mainEl||!mainEl.contains(e.target))return;
        const rect=mainEl.getBoundingClientRect();
        const x=e.clientX-rect.left,y=e.clientY-rect.top;
        if(drawMode==='line'){
            startPt=pixToLogical(x,y);
            if(startPt)startPt._px={x,y};
            e.preventDefault();e.stopPropagation();
        } else if(drawMode==='text'){
            const pt=pixToLogical(x,y);
            if(!pt)return;
            e.preventDefault();e.stopPropagation();
            const txt=prompt('輸入文字標記');
            if(txt&&txt.trim()){
                drawTexts.push({li:pt.li,price:pt.price,text:txt.trim()});
                document.getElementById('btnClearLines').style.display='inline-block';
                redrawCanvas();
            }
        }
    },true);
    el.addEventListener('pointermove',e=>{
        if(drawMode!=='line'||!startPt)return;
        const mainEl=document.getElementById('chartMain');if(!mainEl)return;
        const rect=mainEl.getBoundingClientRect();
        const x=e.clientX-rect.left,y=e.clientY-rect.top;
        redrawCanvas();
        const c=drawCanvas;if(!c)return;
        const ctx=c.getContext('2d');
        ctx.strokeStyle='#ff980080';ctx.lineWidth=2;ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.moveTo(startPt._px.x,startPt._px.y);ctx.lineTo(x,y);ctx.stroke();ctx.setLineDash([]);
    });
    document.addEventListener('pointerup',e=>{
        if(drawMode!=='line'||!startPt)return;
        const mainEl=document.getElementById('chartMain');if(!mainEl)return;
        const rect=mainEl.getBoundingClientRect();
        const x=e.clientX-rect.left,y=e.clientY-rect.top;
        if(Math.abs(x-startPt._px.x)+Math.abs(y-startPt._px.y)>5){
            const endPt=pixToLogical(x,y);
            if(endPt){
                drawLines.push({li1:startPt.li,price1:startPt.price,li2:endPt.li,price2:endPt.price});
                document.getElementById('btnClearLines').style.display='inline-block';
            }
        }
        startPt=null;redrawCanvas();
    });
}

// --- Fundamentals ---
async function loadFundamentals(code){
    const [revRes,divRes]=await Promise.all([fetch(`/api/stock/${code}/revenue`),fetch(`/api/stock/${code}/dividend`)]);
    const rev=await revRes.json(), div=await divRes.json();
    renderRevenueChart('revenueChart', rev);
    renderDividendChart('dividendChart', div);
}

function renderRevenueChart(id, data){
    const el=document.getElementById(id); el.innerHTML='';
    if(!data||data.length===0){el.innerHTML='<div class="loading">無資料</div>';return;}

    // Group by year
    const years={};
    data.forEach(d=>{if(!years[d.year])years[d.year]=[];years[d.year].push(d);});
    const yearKeys=Object.keys(years).sort();
    const colors=['#4fc3f7','#ffeb3b','#e91e63','#66bb6a','#ff9800','#ce93d8'];

    const c=LightweightCharts.createChart(el,{width:el.clientWidth,height:170,
        layout:{background:{color:'#14161e'},textColor:'#8b9dc3'},
        grid:{vertLines:{color:'#1f222d'},horzLines:{color:'#1f222d'}},
        handleScroll:false,handleScale:false,
        timeScale:{borderColor:'#2a2d38'},rightPriceScale:{borderColor:'#2a2d38'}});

    const currentYear = new Date().getFullYear().toString();
    yearKeys.forEach((yr,i)=>{
        const s=c.addLineSeries({color:colors[i%colors.length],lineWidth:2,title:yr,lastValueVisible:false,priceLineVisible:false,lineStyle:yr===currentYear?0:2});
        // Use a fixed base year so all lines align on same x (month)
        const sorted=years[yr].sort((a,b)=>a.month-b.month);
        s.setData(sorted.map(d=>({time:`2000-${String(d.month).padStart(2,'0')}-01`,value:d.revenue/1e8})));
    });
    c.timeScale().fitContent();
}

function renderDividendChart(id,data){
    const el=document.getElementById(id); el.innerHTML='';
    if(!data||data.length===0){el.innerHTML='<div class="loading">無資料</div>';return;}
    const c=LightweightCharts.createChart(el,{width:el.clientWidth,height:170,
        layout:{background:{color:'#14161e'},textColor:'#8b9dc3'},
        grid:{vertLines:{color:'#1f222d'},horzLines:{color:'#1f222d'}},
        handleScroll:false,handleScale:false,
        timeScale:{borderColor:'#2a2d38'},rightPriceScale:{borderColor:'#2a2d38'}});
    const s=c.addHistogramSeries({color:'#4fc3f7',priceFormat:{type:'price',precision:2,minMove:0.01}});
    const sorted=data.sort((a,b)=>a.year.localeCompare(b.year));
    s.setData(sorted.map(d=>({time:d.year+'-07-01',value:d.cash+d.stock})));
    c.timeScale().fitContent();
}

// --- Watchlist ---
async function loadWatchlist(){
    const p=document.getElementById('watchlistPanel');
    if(currentUser==='default'){
        p.innerHTML='<div class="loading" style="color:#ff9800;">請在右上角輸入使用者名稱</div>';
        return;
    }
    const [r, gr, br, tr]=await Promise.all([fetch(U('/api/watchlist')),fetch(U('/api/watchlist/groups')),fetch(U('/api/watchlist/balance')),fetch(U('/api/watchlist/trades'))]);
    const list=await r.json();
    const emptyGroups=await gr.json();
    const {balance}=await br.json();
    const allTrades=await tr.json();
    // Group trades by stock_code
    const tradesByCode={};
    allTrades.forEach(t=>{if(!tradesByCode[t.stock_code])tradesByCode[t.stock_code]=[];tradesByCode[t.stock_code].push(t);});

    // Fetch latest prices
    let prices={};
    for(const s of list){
        if(tradesByCode[s.stock_code]&&tradesByCode[s.stock_code].length>0&&!prices[s.stock_code]){
            try{const kr=await fetch(`/api/stock/${s.stock_code}/kline?period=daily&days=1`);const kd=await kr.json();if(kd.length)prices[s.stock_code]=kd[kd.length-1].close;}catch(e){}
        }
    }

    // Calc totals from trades
    let totalCost=0,totalMV=0;
    list.forEach(s=>{
        const trades=tradesByCode[s.stock_code]||[];
        let shares=0,cost=0;
        trades.forEach(t=>{shares+=t.buy_shares;cost+=t.buy_price*t.buy_shares*1000;});
        const cp=prices[s.stock_code]||0;
        totalCost+=cost;
        totalMV+=cp*shares*1000;
    });
    const totalPL=totalMV-totalCost;
    const totalRet=totalCost>0?((totalPL/totalCost)*100).toFixed(2):0;
    const totalAsset=balance+totalMV;

    // Group by group_name
    const groups={};
    emptyGroups.forEach(g=>{if(!groups[g])groups[g]=[];});
    list.forEach(s=>{const g=s.group_name||'預設';if(!groups[g])groups[g]=[];groups[g].push(s);});
    const groupNames=Object.keys(groups);
    watchGroups={}; groupNames.forEach(g=>watchGroups[g]=groups[g].map(s=>s.stock_code));
    // Summary header
    let html=`<div style="padding:8px 14px;border-bottom:1px solid #2a2d38;font-size:11px;display:flex;flex-wrap:wrap;gap:8px;background:#14161e;">
        <span>💰 餘額: <b style="color:#4fc3f7">${Math.round(balance).toLocaleString()}</b></span>
        <span>📊 市值: <b style="color:#66bb6a">${Math.round(totalMV).toLocaleString()}</b></span>
        <span>💵 成本: <b>${Math.round(totalCost).toLocaleString()}</b></span>
        <span>損益: <b style="color:${totalPL>=0?'#ef5350':'#26a69a'}">${totalPL>=0?'+':''}${Math.round(totalPL).toLocaleString()} (${totalRet}%)</b></span>
        <span>🏦 總資產: <b style="color:#ffeb3b">${Math.round(totalAsset).toLocaleString()}</b></span>
        <button class="btn btn-s" onclick="deposit()" style="font-size:9px;padding:1px 5px;">入金</button>
    </div>`;

    if(!groupNames.length){p.innerHTML=html+`<div style="padding:6px 10px;border-bottom:1px solid #2a2d38;">
        <button class="btn btn-s" onclick="addGroup()" style="font-size:10px;">＋ 新增分組</button>
    </div><div class="loading">無自選股</div>`;return;}

    html+=`<div style="padding:6px 10px;border-bottom:1px solid #2a2d38;">
        <button class="btn btn-s" onclick="addGroup()" style="font-size:10px;">＋ 新增分組</button>
    </div>`;

    html+=groupNames.map(g=>`
        <div class="wl-group" data-group="${g}">
            <div style="padding:6px 14px;background:#14161e;display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'">
                <span style="font-size:12px;color:#ffb74d;font-weight:600;">▾ ${g} (${groups[g].length})</span>
                <span style="display:flex;gap:4px;">
                    <span class="del" onclick="event.stopPropagation();renameGroup('${g}')" title="重命名" style="color:#4fc3f7;font-size:11px;cursor:pointer;">✎</span>
                    <span class="del" onclick="event.stopPropagation();delGroup('${g}')" title="刪除分組" style="color:#ef5350;font-size:11px;cursor:pointer;">🗑</span>
                </span>
            </div>
            <div>${groups[g].map(s=>{
                const trades=tradesByCode[s.stock_code]||[];
                let totalShares=0,totalCostS=0;
                trades.forEach(t=>{totalShares+=t.buy_shares;totalCostS+=t.buy_price*t.buy_shares*1000;});
                const cp=prices[s.stock_code]||0;
                const mv=cp*totalShares*1000;
                const pl=mv-totalCostS;
                const ret=totalCostS>0?((pl/totalCostS)*100).toFixed(1):'—';
                const avgCost=totalShares>0?(totalCostS/totalShares/1000).toFixed(2):0;
                const hasPos=totalShares>0;
                return `<div class="stock-item" style="flex-wrap:wrap;" onclick="loadStock('${s.stock_code}')">
                <div class="info"><span class="code">${s.stock_code}</span><span class="name">${s.stock_name}</span></div>
                <span style="display:flex;gap:4px;align-items:center;">
                    ${hasPos?`<span style="font-size:10px;color:${pl>=0?'#ef5350':'#26a69a'};">${ret}%</span>`:''}
                    <select onchange="event.stopPropagation();moveStock('${s.stock_code}',this.value)" style="font-size:10px;padding:1px 3px;border-radius:3px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;">
                        ${groupNames.map(gn=>`<option value="${gn}"${gn===g?' selected':''}>${gn}</option>`).join('')}
                    </select>
                    <span onclick="event.stopPropagation();toggleTrades('${s.stock_code}')" title="交易明細" style="color:#8b9dc3;font-size:11px;cursor:pointer;">💲</span>
                    ${hasPos?`<span onclick="event.stopPropagation();sellStock('${s.stock_code}')" title="賣出" style="color:#ff9800;font-size:11px;cursor:pointer;">📤</span>`:''}
                    <span onclick="event.stopPropagation();openAlertPanel('${s.stock_code}')" title="警示設定" style="color:#ffeb3b;font-size:11px;cursor:pointer;">🔔</span>
                    <span class="del" onclick="event.stopPropagation();delWatch('${s.stock_code}')">✕</span>
                </span>
                ${hasPos?`<div onclick="event.stopPropagation()" style="width:100%;font-size:10px;color:#6b7a8d;padding:1px 0 0 32px;">現${cp} | 均價${avgCost} × ${totalShares}張 | 損益 <span style="color:${pl>=0?'#ef5350':'#26a69a'}">${pl>=0?'+':''}${Math.round(pl).toLocaleString()}</span></div>`:''}
                <div id="trades-${s.stock_code}" style="display:none;width:100%;padding:4px 0 0 0;"></div>
            </div>`;}).join('')}</div>
        </div>`).join('');
    p.innerHTML=html;
}
async function toggleWatch(){
    if(!currentCode)return;
    if(currentUser==='default'){alert('請先輸入使用者名稱');return;}
    const [list,allGroups]=await Promise.all([fetch(U('/api/watchlist')).then(r=>r.json()),fetch(U('/api/watchlist/groups')).then(r=>r.json())]);
    const exists=list.some(s=>s.stock_code===currentCode);
    if(exists){await fetch(U(`/api/watchlist/${currentCode}`),{method:'DELETE'});}
    else{
        const groups=[...new Set([...allGroups,...list.map(s=>s.group_name||'預設'),'預設'])];
        const g=prompt(`加入分組：\n${groups.map((n,i)=>`${i+1}. ${n}`).join('\n')}\n\n輸入分組名稱（或直接 Enter 用「預設」）`,'預設')||'預設';
        await fetch(U(`/api/watchlist/${currentCode}?name=${encodeURIComponent(window._sm?.[currentCode]||'')}&group=${encodeURIComponent(g)}`),{method:'POST'});
    }
    loadWatchlist(); updateWatchBtn();
}
async function delWatch(code){await fetch(U(`/api/watchlist/${code}`),{method:'DELETE'});loadWatchlist();}
async function updateWatchBtn(){
    if(currentUser==='default'){document.getElementById('btnWatch').textContent='☆ 加入自選';document.getElementById('btnWatch').style.color='';return;}
    const list=await(await fetch(U('/api/watchlist'))).json();
    const exists=list.some(s=>s.stock_code===currentCode);
    document.getElementById('btnWatch').textContent=exists?'★ 已加入':'☆ 加入自選';
    document.getElementById('btnWatch').style.color=exists?'#ffeb3b':'';
}
async function moveStock(code,group){await fetch(U(`/api/watchlist/${code}/move?group=${encodeURIComponent(group)}`),{method:'PUT'});loadWatchlist();}
async function editCost(code){
    const list=await fetch(U('/api/watchlist')).then(r=>r.json());
    const item=list.find(s=>s.stock_code===code)||{};
    const p=prompt('買入價',item.buy_price||'');if(p===null)return;
    const s=prompt('張數',item.buy_shares||'');if(s===null)return;
    const d=prompt('買入日期 如2026-06-29',item.buy_date||'');if(d===null)return;
    await fetch(U(`/api/watchlist/${code}/cost?price=${p||0}&shares=${s||0}&date=${encodeURIComponent(d||'')}`),{method:'PUT'});
    loadWatchlist();
}
async function toggleTrades(code){
    const el=document.getElementById('trades-'+code);
    if(el.style.display!=='none'){el.style.display='none';return;}
    el.style.display='block';
    await renderTrades(code);
}
async function renderTrades(code){
    const el=document.getElementById('trades-'+code);if(!el)return;
    const trades=await fetch(U(`/api/watchlist/${code}/trades`)).then(r=>r.json());
    el.innerHTML=`<div onclick="event.stopPropagation()" style="padding:4px 8px;">
        <div style="display:flex;gap:4px;margin-bottom:6px;">
            <input type="number" id="tradePrice-${code}" placeholder="買入價" style="width:60px;padding:3px;font-size:11px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;">
            <input type="number" id="tradeShares-${code}" placeholder="張數" style="width:45px;padding:3px;font-size:11px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;">
            <input type="text" id="tradeDate-${code}" placeholder="日期" style="width:85px;padding:3px;font-size:11px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;">
            <button class="btn btn-s" onclick="addNewTrade('${code}')" style="font-size:10px;padding:2px 6px;">新增</button>
        </div>
        ${trades.length?trades.map(t=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;padding:2px 0;border-top:1px solid #2a2d38;font-size:10px;color:#ccc;">
            <span>${t.buy_date||'—'}</span>
            <span>$${t.buy_price} × ${t.buy_shares}張</span>
            <span style="color:#6b7a8d;">= ${(t.buy_price*t.buy_shares*1000).toLocaleString()}</span>
            <span onclick="delTrade(${t.id},'${code}')" style="color:#ef5350;cursor:pointer;margin-left:auto;">✕</span>
        </div>`).join(''):'<div style="font-size:10px;color:#6b7a8d;">尚無交易記錄</div>'}
    </div>`;
}
async function addNewTrade(code){
    const p=document.getElementById('tradePrice-'+code).value;
    const s=document.getElementById('tradeShares-'+code).value;
    const d=document.getElementById('tradeDate-'+code).value;
    if(!p||!s||+p<=0||+s<=0){alert('請輸入買入價和張數');return;}
    await fetch(U(`/api/watchlist/${code}/trades?price=${p}&shares=${s}&date=${encodeURIComponent(d||'')}`),{method:'POST'});
    await renderTrades(code);
    loadWatchlist();
}
async function delTrade(id,code){
    await fetch(U(`/api/watchlist/trades/${id}`),{method:'DELETE'});
    await renderTrades(code);
    loadWatchlist();
}
async function sellStock(code){
    const p=prompt('賣出價','')||'0';
    const s=prompt('賣出張數','')||'0';
    if(+p<=0||+s<=0)return;
    await fetch(U(`/api/watchlist/${code}/sell?price=${p}&shares=${s}`),{method:'POST'});
    loadWatchlist();
}
async function deposit(){
    const a=prompt('入金金額','');
    if(!a||+a===0)return;
    await fetch(U(`/api/watchlist/balance?amount=${a}`),{method:'POST'});
    loadWatchlist();
}
// --- Floating Notes Window ---
let floatNotesOpen=false;
function toggleFloatNotes(){
    const w=document.getElementById('floatNotes');
    if(floatNotesOpen){closeFloatNotes();return;}
    if(!currentCode)return;
    w.style.display='flex';
    floatNotesOpen=true;
    renderFloatNotes(currentCode);
}
function closeFloatNotes(){
    document.getElementById('floatNotes').style.display='none';
    floatNotesOpen=false;
}
async function renderFloatNotes(code){
    if(!floatNotesOpen)return;
    const title=document.getElementById('floatNotesTitle');
    const body=document.getElementById('floatNotesBody');
    title.textContent=`📝 ${code} 備註`;
    const notes=await fetch(U(`/api/watchlist/${code}/notes`)).then(r=>r.json());
    body.innerHTML=`<div style="padding:4px;">
        <div style="display:flex;gap:4px;margin-bottom:6px;">
            <input type="text" id="noteInput-${code}" placeholder="輸入備註..." style="flex:1;padding:3px 6px;font-size:11px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;">
            <label class="btn btn-s" style="font-size:10px;padding:2px 6px;cursor:pointer;">📎<input type="file" accept="image/*" style="display:none;" onchange="uploadNote('${code}',this.files[0])"></label>
            <button class="btn btn-s" onclick="submitNote('${code}')" style="font-size:10px;padding:2px 6px;">送出</button>
        </div>
        ${notes.map(n=>`<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;padding:3px 0;border-top:1px solid #2a2d38;">
            <div style="flex:1;font-size:11px;color:#ccc;">
                ${n.content?`<span>${n.content.replace(/</g,'&lt;')}</span>`:''}
                ${n.has_image?`<img src="/api/watchlist/notes/${n.id}/image" style="max-width:120px;max-height:80px;border-radius:4px;display:block;margin-top:2px;cursor:pointer;" onclick="window.open('/api/watchlist/notes/${n.id}/image','_blank')">`:n.image_path?`<img src="${n.image_path}" style="max-width:120px;max-height:80px;border-radius:4px;display:block;margin-top:2px;cursor:pointer;" onclick="window.open('${n.image_path}','_blank')">`:''}
                <div style="font-size:9px;color:#6b7a8d;margin-top:1px;">${n.created_at}</div>
            </div>
            <span onclick="delNote(${n.id},'${code}')" style="color:#ef5350;cursor:pointer;font-size:11px;">✕</span>
        </div>`).join('')}
    </div>`;
}
async function submitNote(code){const inp=document.getElementById('noteInput-'+code);const v=inp.value.trim();if(!v)return;const fd=new FormData();fd.append('content',v);await fetch(U(`/api/watchlist/${code}/notes`),{method:'POST',body:fd});renderFloatNotes(code);}
async function uploadNote(code,file){if(!file)return;const fd=new FormData();fd.append('content','');fd.append('image',file);await fetch(U(`/api/watchlist/${code}/notes`),{method:'POST',body:fd});renderFloatNotes(code);}
async function delNote(id,code){await fetch(U(`/api/watchlist/notes/${id}`),{method:'DELETE'});renderFloatNotes(code);}

// --- Alert Panel ---
let alertPanelCode='';
function openAlertPanel(code){
    alertPanelCode=code;
    const w=document.getElementById('floatAlert');
    w.style.display='flex';
    document.getElementById('floatAlertTitle').textContent=`🔔 ${code} 警示設定`;

function closeAlertPanel(){document.getElementById('floatAlert').style.display='none';alertPanelCode='';}
async function renderAlertPanel(code){
    const body=document.getElementById('floatAlertBody');
    const [alerts,settings]=await Promise.all([
        fetch(U(`/api/alerts?stock_code=${code}`)).then(r=>r.json()),
        fetch(U('/api/alerts/settings')).then(r=>r.json())
    ]);
    const typeLabels={price_above:'股價 ≥',price_below:'股價 ≤',change_pct_up:'漲幅 ≥',change_pct_down:'跌幅 ≥',ma_cross_up:'MA金叉',ma_cross_down:'MA死叉',volume:'量 ≥ 均量'};
    body.innerHTML=`
        <div class="alert-form" style="margin-bottom:10px;padding:8px;background:#14161e;border-radius:6px;">
            <div style="margin-bottom:6px;font-weight:600;color:#ffeb3b;">新增條件</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
                <select id="alertType" onchange="onAlertTypeChange()">
                    <option value="price_above">股價 ≥</option>
                    <option value="price_below">股價 ≤</option>
                    <option value="change_pct_up">漲幅 ≥ %</option>
                    <option value="change_pct_down">跌幅 ≥ %</option>
                    <option value="ma_cross_up">MA金叉(短上穿長)</option>
                    <option value="ma_cross_down">MA死叉(短下穿長)</option>
                    <option value="volume">量 ≥ N倍均量</option>
                </select>
                <span id="alertParamsArea"></span>
                <select id="alertRepeat">
                    <option value="once">觸發一次</option>
                    <option value="daily">每日持續</option>
                </select>
                <button class="btn btn-p" onclick="addAlertItem('${code}')" style="font-size:10px;padding:3px 8px;">新增</button>
            </div>
        </div>
        <div style="margin-bottom:8px;font-weight:600;color:#8b9dc3;">已設條件 (${alerts.length})</div>
        <div id="alertList">${alerts.length?alerts.map(a=>`
            <div class="alert-list-item">
                <input type="checkbox" ${a.enabled?'checked':''} onchange="toggleAlertEnabled(${a.id},this.checked,'${code}')">
                <span style="flex:1;color:#ccc;">${typeLabels[a.alert_type]||a.alert_type} ${formatAlertParams(a.alert_type,a.params)}</span>
                <span style="font-size:9px;color:#6b7a8d;">${a.repeat_mode==='once'?'一次':'持續'}</span>
                <span onclick="deleteAlertItem(${a.id},'${code}')" style="color:#ef5350;cursor:pointer;">✕</span>
            </div>`).join(''):'<div style="color:#6b7a8d;padding:4px;">尚無警示條件</div>'}
        </div>
        <div style="margin-top:12px;padding-top:8px;border-top:1px solid #2a2d38;">
            <div style="font-weight:600;color:#8b9dc3;margin-bottom:4px;">全域設定</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
                <span style="color:#8b9dc3;font-size:10px;">每日 18:30 執行</span>
            </div>
        </div>
    `;
    onAlertTypeChange();
}
function onAlertTypeChange(){
    const t=document.getElementById('alertType').value;
    const area=document.getElementById('alertParamsArea');
    if(t==='price_above'||t==='price_below') area.innerHTML='<input type="number" id="alertParam1" placeholder="價格" style="width:60px;">';
    else if(t==='change_pct_up'||t==='change_pct_down') area.innerHTML='<input type="number" id="alertParam1" placeholder="%" step="0.1" style="width:50px;">';
    else if(t==='ma_cross_up'||t==='ma_cross_down') area.innerHTML='短<input type="number" id="alertParam1" value="5" style="width:35px;">長<input type="number" id="alertParam2" value="20" style="width:35px;">';
    else if(t==='volume') area.innerHTML='<input type="number" id="alertParam1" placeholder="倍" value="2" step="0.5" style="width:45px;">倍';
}
function formatAlertParams(type,params){
    if(type==='price_above'||type==='price_below') return params.threshold||'';
    if(type==='change_pct_up'||type==='change_pct_down') return (params.threshold||'')+'%';
    if(type==='ma_cross_up'||type==='ma_cross_down') return `MA${params.short_period||5}/MA${params.long_period||20}`;
    if(type==='volume') return (params.multiplier||'')+'倍均量';
    return JSON.stringify(params);
}
async function addAlertItem(code){
    const t=document.getElementById('alertType').value;
    const rep=document.getElementById('alertRepeat').value;
    let params={};
    if(t==='price_above'||t==='price_below') params={threshold:+document.getElementById('alertParam1').value};
    else if(t==='change_pct_up'||t==='change_pct_down') params={threshold:+document.getElementById('alertParam1').value};
    else if(t==='ma_cross_up'||t==='ma_cross_down') params={short_period:+document.getElementById('alertParam1').value,long_period:+document.getElementById('alertParam2').value};
    else if(t==='volume') params={multiplier:+document.getElementById('alertParam1').value};
    await fetch('/api/alerts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stock_code:code,alert_type:t,params,repeat_mode:rep,user:currentUser})});
    renderAlertPanel(code);
}
async function deleteAlertItem(id,code){
    await fetch(U(`/api/alerts/${id}`),{method:'DELETE'});
    renderAlertPanel(code);
}
async function toggleAlertEnabled(id,enabled,code){
    await fetch(`/api/alerts/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:currentUser,enabled})});
    renderAlertPanel(code);
}

function closeBacktest(){document.getElementById('floatBacktest').style.display='none';}
function renderBacktestForm(){
    const body=document.getElementById('floatBacktestBody');
    body.innerHTML=`
        <div style="margin-bottom:8px;"><b style="color:#66bb6a;">股票：</b><span style="color:#4fc3f7;">${currentCode}</span>
            <span style="margin-left:12px;color:#8b9dc3;">天數</span> <input type="number" id="btDays" value="500" style="width:50px;padding:2px 4px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:11px;">
            <span style="margin-left:8px;color:#8b9dc3;">張數</span> <input type="number" id="btShares" value="1" style="width:35px;padding:2px 4px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:11px;">

            <span style="margin-left:8px;color:#8b9dc3;">交易稅%</span> <input type="number" id="btTax" value="0.3" step="0.01" style="width:45px;padding:2px 4px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:11px;">
        </div>
        <div style="margin-bottom:8px;">
            <b style="color:#ef5350;">買入條件</b> <select id="btBuyLogic" style="font-size:10px;"><option value="and">全部符合(AND)</option><option value="or">任一符合(OR)</option></select>
            <button class="btn btn-s" onclick="addBtCond('buy')" style="font-size:9px;padding:1px 4px;margin-left:4px;">+</button>
            <div id="btBuyList">${btBuyConditions.map((c,i)=>renderBtCond('buy',c,i)).join('')}</div>
        </div>

            <b style="color:#26a69a;">賣出條件</b> <select id="btSellLogic" style="font-size:10px;"><option value="and">全部符合(AND)</option><option value="or">任一符合(OR)</option></select>

        <div id="btResults" style="margin-top:10px;"></div>
    `;
}
function renderBtCond(side,cond,idx){
    const types=['price_above:股價≥','price_below:股價≤','change_pct_up:漲幅≥%','change_pct_down:跌幅≥%','ma_cross_up:MA金叉','ma_cross_down:MA死叉','ma_above:站上MA','ma_below:跌破MA','volume:量≥N倍均量'];
    let paramHtml='';
    if(cond.type==='price_above'||cond.type==='price_below') paramHtml=`<input type="number" value="${cond.params.threshold||''}" onchange="updateBtParam('${side}',${idx},'threshold',+this.value)" style="width:55px;" placeholder="價格">`;
    else if(cond.type==='change_pct_up'||cond.type==='change_pct_down') paramHtml=`<input type="number" value="${cond.params.threshold||''}" step="0.5" onchange="updateBtParam('${side}',${idx},'threshold',+this.value)" style="width:45px;" placeholder="%">%`;
    else if(cond.type==='ma_cross_up'||cond.type==='ma_cross_down') paramHtml=`短<input type="number" value="${cond.params.short_period||5}" onchange="updateBtParam('${side}',${idx},'short_period',+this.value)" style="width:30px;">長<input type="number" value="${cond.params.long_period||20}" onchange="updateBtParam('${side}',${idx},'long_period',+this.value)" style="width:30px;">`;
    else if(cond.type==='ma_above'||cond.type==='ma_below') paramHtml=`MA<input type="number" value="${cond.params.period||20}" onchange="updateBtParam('${side}',${idx},'period',+this.value)" style="width:35px;">`;
    else if(cond.type==='volume') paramHtml=`<input type="number" value="${cond.params.multiplier||2}" step="0.5" onchange="updateBtParam('${side}',${idx},'multiplier',+this.value)" style="width:35px;">倍`;
    return `<div class="bt-cond"><select onchange="changeBtType('${side}',${idx},this.value)" style="font-size:10px;">${types.map(t=>{const[v,l]=t.split(':');return `<option value="${v}"${v===cond.type?' selected':''}>${l}</option>`;}).join('')}</select>${paramHtml}<span onclick="removeBtCond('${side}',${idx})" style="color:#ef5350;cursor:pointer;">✕</span></div>`;
}
function addBtCond(side){
    const arr=side==='buy'?btBuyConditions:btSellConditions;
    arr.push({type:'ma_cross_up',params:{short_period:5,long_period:20}});
    renderBacktestForm();
}
function removeBtCond(side,idx){
    const arr=side==='buy'?btBuyConditions:btSellConditions;
    arr.splice(idx,1);
    renderBacktestForm();
}
function changeBtType(side,idx,newType){
    const arr=side==='buy'?btBuyConditions:btSellConditions;
    let params={};
    if(newType==='price_above'||newType==='price_below')params={threshold:0};
    else if(newType==='change_pct_up'||newType==='change_pct_down')params={threshold:3};
    else if(newType==='ma_cross_up'||newType==='ma_cross_down')params={short_period:5,long_period:20};
    else if(newType==='ma_above'||newType==='ma_below')params={period:20};
    else if(newType==='volume')params={multiplier:2};
    arr[idx]={type:newType,params};
    renderBacktestForm();
}
function updateBtParam(side,idx,key,val){
    const arr=side==='buy'?btBuyConditions:btSellConditions;
    arr[idx].params[key]=val;
}
async function runBacktest(){
    const res=document.getElementById('btResults');
    res.innerHTML='<div style="color:#8b9dc3;">回測中...</div>';
    const body={
        stock_code:currentCode,
        buy_conditions:btBuyConditions,
        sell_conditions:btSellConditions,
        buy_logic:document.getElementById('btBuyLogic').value,
        sell_logic:document.getElementById('btSellLogic').value,
        shares:+document.getElementById('btShares').value||1,
        fee_rate:+document.getElementById('btFee').value||0.1425,
        tax_rate:+document.getElementById('btTax').value||0.3,
        days:+document.getElementById('btDays').value||500,
    };
    const r=await fetch('/api/backtest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await r.json();
    renderBacktestResults(data);
}
function renderBacktestResults(data){
    const res=document.getElementById('btResults');
    const s=data.summary;
    if(!s||!data.trades.length){res.innerHTML='<div style="color:#ff9800;">無交易觸發</div>';return;}
    // Add markers to chart
    if(data.markers&&data.markers.length&&candleSeries){
        const markers=data.markers.map(m=>({
            time:m.date,
            position:m.action==='buy'?'belowBar':'aboveBar',
            color:m.action==='buy'?'#26a69a':'#ef5350',
            shape:m.action==='buy'?'arrowUp':'arrowDown',
            text:m.action==='buy'?`B${m.price}`:`S${m.price}`
        }));
        markers.sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0);
        candleSeries.setMarkers(markers);
    }
    res.innerHTML=`
        <div style="background:#14161e;padding:8px;border-radius:6px;margin-bottom:8px;">
            <div style="display:flex;flex-wrap:wrap;gap:12px;">
                <span>總報酬: <b style="color:${s.total_return>=0?'#ef5350':'#26a69a'}">${s.total_return}%</b></span>
                <span>總損益: <b style="color:${s.total_pnl>=0?'#ef5350':'#26a69a'}">${s.total_pnl.toLocaleString()}</b></span>
                <span>勝率: <b style="color:#ffeb3b">${s.win_rate}%</b></span>
                <span>交易: <b>${s.num_trades}</b>次</span>
                <span>最大回撤: <b style="color:#ff9800">${s.max_drawdown.toLocaleString()}</b></span>
            </div>
        </div>
        <div style="max-height:180px;overflow-y:auto;">
            <table style="width:100%;font-size:10px;border-collapse:collapse;">
                <tr style="color:#8b9dc3;border-bottom:1px solid #2a2d38;"><th>日期</th><th>動作</th><th>價格</th><th>張</th><th>費用</th><th>損益</th></tr>
                ${data.trades.map(t=>`<tr style="border-bottom:1px solid #1f222d;">
                    <td>${t.date}</td>
                    <td style="color:${t.action==='buy'?'#26a69a':'#ef5350'}">${t.action==='buy'?'買':'賣'}</td>
                    <td>${t.price}</td><td>${t.shares}</td><td>${t.cost.toLocaleString()}</td>
                    <td style="color:${t.pnl>=0?'#ef5350':'#26a69a'}">${t.pnl?t.pnl.toLocaleString():'-'}</td>
                </tr>`).join('')}
            </table>
        </div>
    `;
}

    let dragging=false,ox=0,oy=0;
    header.addEventListener('mousedown',e=>{dragging=true;ox=e.clientX-win.offsetLeft;oy=e.clientY-win.offsetTop;});
    document.addEventListener('mousemove',e=>{if(!dragging)return;win.style.left=(e.clientX-ox)+'px';win.style.top=(e.clientY-oy)+'px';});
    document.addEventListener('mouseup',()=>{dragging=false;});
})();

async function renameGroup(old){const n=prompt('新名稱',old);if(n&&n.trim()&&n!==old)await fetch(U(`/api/watchlist/group/rename?old=${encodeURIComponent(old)}&new=${encodeURIComponent(n.trim())}`),{method:'PUT'}).then(()=>loadWatchlist());}
async function delGroup(g){if(confirm(`刪除分組「${g}」及其所有股票？`))await fetch(U(`/api/watchlist/group/${encodeURIComponent(g)}`),{method:'DELETE'}).then(()=>loadWatchlist());}

// --- Hot Stocks ---
async function loadHot(type='active'){
    const tabs={hot:'tabHot',up:'tabUp',down:'tabDown'};
    Object.entries(tabs).forEach(([k,id])=>{document.getElementById(id).style.borderBottom=k==='hot'?'2px solid #4fc3f7':'none';});
    document.getElementById('listPanelTitle').textContent='🔥 社群爆紅榜';
    document.getElementById('listPanelBtns').innerHTML=`<button class="btn ${type==='active'?'btn-p':'btn-s'}" onclick="loadHot('active')" style="font-size:10px;padding:3px 6px;">瀏覽</button><button class="btn ${type==='trending'?'btn-p':'btn-s'}" onclick="loadHot('trending')" style="font-size:10px;padding:3px 6px;">激增</button><button class="btn ${type==='search'?'btn-p':'btn-s'}" onclick="loadHot('search')" style="font-size:10px;padding:3px 6px;">搜尋</button>`;
    const p=document.getElementById('listPanel');
    p.innerHTML='<div class="loading">載入中...</div>';
    try{
        const r=await fetch(`/api/hot-stocks?type=${type}`);
        const stocks=await r.json();
        if(!stocks.length){p.innerHTML='<div class="loading">無資料</div>';return;}
        p.innerHTML=stocks.map(s=>`<div class="stock-item" onclick="document.getElementById('searchInput').value='${s.code}';loadStock('${s.code}')">
            <div class="info"><span class="rank">#${s.rank}</span><span class="code">${s.code}</span><span class="name">${s.name}</span></div>
        </div>`).join('');
    }catch(e){p.innerHTML='<div class="loading">載入失敗，請重試</div>';}
}

// --- Rank ---
function parseRankDate(s){
    s=s.trim().replace(/[\/\.\s]/g,'-');
    let m;
    if((m=s.match(/^(\d{4})-?(\d{2})-?(\d{2})$/)))return `${m[1]}-${m[2]}-${m[3]}`;
    if((m=s.match(/^(\d{2})-(\d{2})$/))){const y=new Date().getFullYear();return `${y}-${m[1]}-${m[2]}`;}
    return '';
}
async function loadRank(direction='up',market='all',histDate){
    histDate=histDate||'';
    const tab=direction;
    const tabs={hot:'tabHot',up:'tabUp',down:'tabDown'};
    Object.entries(tabs).forEach(([k,id])=>{document.getElementById(id).style.borderBottom=k===tab?'2px solid #4fc3f7':'none';});
    document.getElementById('listPanelTitle').textContent=direction==='up'?'📈 漲幅排行':'📉 跌幅排行';
    const hd=histDate.replace(/'/g,'');
    const mkBtns=(d)=>`<button class="btn ${market==='all'?'btn-p':'btn-s'}" onclick="loadRank('${d}','all','${hd}')" style="font-size:10px;padding:3px 6px;">合併</button><button class="btn ${market==='tse'?'btn-p':'btn-s'}" onclick="loadRank('${d}','tse','${hd}')" style="font-size:10px;padding:3px 6px;">上市</button><button class="btn ${market==='otc'?'btn-p':'btn-s'}" onclick="loadRank('${d}','otc','${hd}')" style="font-size:10px;padding:3px 6px;">上櫃</button> <input type="text" value="${hd}" placeholder="日期 如20260629" onkeydown="if(event.key==='Enter'){const v=parseRankDate(this.value);if(v)loadRank('${d}','${market}',v);else this.style.borderColor='#ef5350';}" style="font-size:10px;width:100px;padding:2px 4px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;">`;
    document.getElementById('listPanelBtns').innerHTML=mkBtns(direction);
    const p=document.getElementById('listPanel');
    p.innerHTML='<div class="loading">載入中...</div>';
    let url=hd?`/api/rank/history?date=${hd}&direction=${direction}&market=${market}`:`/api/rank?direction=${direction}&market=${market}`;
    const r=await fetch(url);
    const stocks=await r.json();
    if(!stocks.length){p.innerHTML='<div class="loading">無資料</div>';return;}
    p.innerHTML=stocks.map((s,i)=>`<div class="stock-item" onclick="document.getElementById('searchInput').value='${s.code}';loadStock('${s.code}')">
        <div class="info"><span class="rank">#${s.rank||i+1}</span><span class="code">${s.code}</span><span class="name">${s.name}</span></div>
        <span style="color:${direction==='up'?'#ef5350':'#26a69a'};font-size:12px;font-weight:600">${s.change_pct}</span>
    </div>`).join('');
}

// --- News Notes ---
async function loadNewsNotes(){
    const el=document.getElementById('newsNotesList');
    const notes=await fetch('/api/watchlist/NEWS/notes?user=shared').then(r=>r.json());
    if(!notes.length){el.innerHTML='<div style="color:#6b7a8d;font-size:11px;">尚無備註</div>';return;}
    // Group by news_date
    const groups={};
    notes.forEach(n=>{
        const d=n.news_date||'未分類';
        if(!groups[d])groups[d]=[];
        groups[d].push(n);
    });
    const sortedDates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
    const showDates=sortedDates.slice(0,5);
    const moreDates=sortedDates.slice(5);
    el.innerHTML=showDates.map((date,di)=>`
        <div style="margin-bottom:8px;">
            <div onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none';this.querySelector('.nn-arrow').textContent=this.nextElementSibling.style.display==='none'?'▸':'▾'" style="font-size:12px;font-weight:600;color:#ffb74d;padding:6px 4px;border-bottom:1px solid #3a3d48;cursor:pointer;user-select:none;"><span class="nn-arrow">▸</span> 📅 ${date} (${groups[date].length})</div>
            <div style="display:none;">
                ${groups[date].map(n=>`<div data-note="${(n.content||'').replace(/"/g,'')}" style="display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;padding:4px 8px;">
                    <div style="flex:1;font-size:11px;color:#ccc;">
                        ${n.content?`<span>${n.content.replace(/</g,'&lt;')}</span>`:''}
                        ${n.has_image?`<img src="/api/watchlist/notes/${n.id}/image" style="max-width:200px;max-height:120px;border-radius:4px;display:block;margin-top:4px;cursor:pointer;" onclick="window.open('/api/watchlist/notes/${n.id}/image','_blank')">`:''}
                    </div>
                    <span onclick="editNewsNote(${n.id},'${(n.content||'').replace(/'/g,"\\'").replace(/\n/g,' ')}')" style="color:#4fc3f7;cursor:pointer;font-size:11px;" title="編輯">✎</span>
                    <span onclick="delNewsNote(${n.id})" style="color:#ef5350;cursor:pointer;font-size:11px;">✕</span>
                </div>`).join('')}
            </div>
        </div>
    `).join('')+(moreDates.length?`<div id="newsNotesMore" style="display:none;">${moreDates.map(date=>`
        <div style="margin-bottom:8px;">
            <div onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none';this.querySelector('.nn-arrow').textContent=this.nextElementSibling.style.display==='none'?'▸':'▾'" style="font-size:12px;font-weight:600;color:#ffb74d;padding:6px 4px;border-bottom:1px solid #3a3d48;cursor:pointer;user-select:none;"><span class="nn-arrow">▸</span> 📅 ${date} (${groups[date].length})</div>
            <div style="display:none;">${groups[date].map(n=>`<div data-note="${(n.content||'').replace(/"/g,'')}" style="display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;padding:4px 8px;">
                    <div style="flex:1;font-size:11px;color:#ccc;">
                        ${n.content?`<span>${n.content.replace(/</g,'&lt;')}</span>`:''}
                        ${n.has_image?`<img src="/api/watchlist/notes/${n.id}/image" style="max-width:200px;max-height:120px;border-radius:4px;display:block;margin-top:4px;cursor:pointer;" onclick="window.open('/api/watchlist/notes/${n.id}/image','_blank')">`:''}
                    </div>
                    <span onclick="editNewsNote(${n.id},'${(n.content||'').replace(/'/g,"\\'").replace(/\n/g,' ')}')" style="color:#4fc3f7;cursor:pointer;font-size:11px;" title="編輯">✎</span>
                    <span onclick="delNewsNote(${n.id})" style="color:#ef5350;cursor:pointer;font-size:11px;">✕</span>
                </div>`).join('')}</div>
        </div>`).join('')}</div><button class="btn btn-s" onclick="document.getElementById('newsNotesMore').style.display='block';this.style.display='none';" style="font-size:10px;padding:4px 8px;margin-top:4px;">顯示更多 (${moreDates.length} 天)</button>`:'');
}
async function submitNewsNote(){
    const inp=document.getElementById('newsNoteInput');
    const dateInp=document.getElementById('newsNoteDate');
    const v=inp.value.trim();if(!v)return;
    const fd=new FormData();fd.append('content',v);fd.append('news_date',dateInp.value);
    await fetch('/api/watchlist/NEWS/notes?user=shared',{method:'POST',body:fd});
    inp.value='';loadNewsNotes();
}
async function uploadNewsNote(files){
    if(!files||!files.length)return;
    const dateInp=document.getElementById('newsNoteDate');
    let skipped=[];
    for(const file of files){
        const fd=new FormData();fd.append('content','');fd.append('image',file);fd.append('news_date',dateInp.value);
        const r=await fetch('/api/watchlist/NEWS/notes?user=shared',{method:'POST',body:fd});
        const res=await r.json();
        if(res.error==='duplicate') skipped.push(file.name);
    }
    if(skipped.length) alert('以下檔案已存在，跳過上傳：\n'+skipped.join('\n'));
    loadNewsNotes();
}
async function delNewsNote(id){
    await fetch('/api/watchlist/notes/'+id+'?user=shared',{method:'DELETE'});
    loadNewsNotes();
}
async function editNewsNote(id, oldContent){
    // Create modal for multi-line edit
    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:99999;display:flex;align-items:center;justify-content:center;';
    overlay.innerHTML=`<div style="background:#1a1d28;border:1px solid #3a3d48;border-radius:8px;padding:16px;width:400px;max-width:90%;">
        <div style="font-size:12px;color:#8b9dc3;margin-bottom:8px;">修改備註內容：</div>
        <textarea id="editNoteTA" style="width:100%;height:150px;padding:8px;border-radius:4px;border:1px solid #3a3d48;background:#0f1117;color:#e1e5ea;font-size:12px;resize:vertical;line-height:1.5;"></textarea>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
            <button class="btn btn-s" onclick="this.closest('div[style*=fixed]').remove()">取消</button>
            <button class="btn btn-p" onclick="saveEditNote(${id})">儲存</button>
        </div>
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById('editNoteTA').value=oldContent.replace(/\\n/g,'\n');
}
async function saveEditNote(id){
    const ta=document.getElementById('editNoteTA');
    const newContent=ta.value;
    ta.closest('div[style*="fixed"]').remove();
    await fetch(`/api/watchlist/notes/${id}/content`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:newContent,user:'shared'})});
    loadNewsNotes();
}
function searchNewsNotes(){
    const q=document.getElementById('newsNoteSearch').value.trim().toLowerCase();
    const list=document.getElementById('newsNotesList');
    list.querySelectorAll('[data-note]').forEach(el=>{
        el.style.display=(!q||el.dataset.note.toLowerCase().includes(q))?'':'none';
    });
    // Show/hide date group headers based on visible children
    list.querySelectorAll('[data-note]').forEach(el=>{
        const parent=el.parentElement;
        if(parent){
            const visible=[...parent.querySelectorAll('[data-note]')].some(c=>c.style.display!=='none');
            const header=parent.previousElementSibling;
            if(header)header.style.display=visible?'':'none';
            parent.style.display=visible?'':'none';
        }
    });
}
async function aiSearchNotes(){
    const q=document.getElementById('newsNoteSearch').value.trim();
    if(!q)return;
    const el=document.getElementById('newsNotesList');
    el.innerHTML='<div style="color:#4fc3f7;font-size:11px;">🤖 AI 分析中（約 10-20 秒）...</div>';
    try{
        const r=await fetch(`/api/notes/ask?q=${encodeURIComponent(q)}&user=shared`);
        const data=await r.json();
        const keywords=data.keywords||[];
        const sources=data.sources||[];
        const answer=data.answer||'';
        let html=`<div style="font-size:10px;color:#8b9dc3;margin-bottom:6px;">AI 擴展關鍵詞：${keywords.join('、')}</div>`;
        // AI Answer block
        html+=`<div style="background:#14161e;border:1px solid #4fc3f7;border-radius:6px;padding:10px;margin-bottom:10px;">
            <div style="font-size:11px;font-weight:600;color:#4fc3f7;margin-bottom:6px;">🤖 AI 分析回答</div>
            <div style="font-size:12px;color:#e1e5ea;white-space:pre-wrap;line-height:1.6;">${answer.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>
        </div>`;
        // Sources
        if(sources.length){
            html+=`<div style="font-size:10px;color:#8b9dc3;margin-bottom:4px;">參考來源 (${sources.length} 筆)：</div>`;
            html+=sources.map(s=>`<div style="margin-bottom:4px;padding:2px 8px;">
                <div style="font-size:10px;color:#6b7a8d;cursor:pointer;" onmouseover="this.style.color='#4fc3f7'" onmouseout="this.style.color='#6b7a8d'" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">▸ [${s.news_date||''}] ${s.content||''}</div>
                <div style="display:none;padding:6px;margin-top:4px;background:#0f1117;border-radius:4px;border:1px solid #2a2d38;">
                    <div style="font-size:11px;color:#ccc;white-space:pre-wrap;">${s.content||'(無文字)'}</div>
                    ${s.has_image?`<img src="/api/watchlist/notes/${s.id}/image" style="max-width:300px;max-height:200px;border-radius:4px;margin-top:6px;cursor:pointer;" onclick="window.open('/api/watchlist/notes/${s.id}/image','_blank')">`:''}
                </div>
            </div>`).join('');
        }
        el.innerHTML=html;
    }catch(e){el.innerHTML='<div style="color:#ef5350;">AI 搜尋失敗</div>';}
}

// --- Alert Notification Polling ---
if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
function showToast(msg){
    const t=document.createElement('div');
    t.style.cssText='position:fixed;bottom:20px;right:20px;background:#1a1d28;border:1px solid #ffeb3b;color:#e1e5ea;padding:10px 16px;border-radius:6px;font-size:12px;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,0.5);max-width:320px;';
    t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),6000);
}
async function pollAlerts(){
    if(currentUser==='default')return;
    try{
        const res=await fetch(U('/api/alerts/triggered'));
        const items=await res.json();
        items.forEach(a=>{
            showToast(a.message);
            if('Notification' in window && Notification.permission==='granted'){
                new Notification('ProTech 警示',{body:a.message,icon:'📈'});
            }
        });
    }catch(e){}
}
setInterval(pollAlerts,30000);
